<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artistic WorldGuessr</title>
    <link rel="stylesheet" href="view.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div id="name-form-container">
        <h1>Welcome to Artistic WorldGuessr</h1>
        <form id="name-form">
            <label for="player1-name">Player 1 Name:</label>
            <input type="text" id="player1-name" placeholder="Enter Player 1 Name" required>
            <br>
            <label for="player2-name">Player 2 Name:</label>
            <input type="text" id="player2-name" placeholder="Enter Player 2 Name" required>
            <br>
            <button type="submit">Start Game</button>
        </form>
    </div>

    <div id="game-container" style="display: none;">
        <!-- Street View Container -->
        <div id="street-view" style="width: 100%; height: 400px;"></div>

        <!-- Artistic Map View -->
        <div id="map" style="width: 100%; height: 400px; margin-top: 20px;"></div>

        <!-- Scoreboard -->
        <div id="scoreboard" aria-live="polite">
            <p>Round: <span id="round">1</span> / 10</p>
            <p>Score: <span id="score">0</span></p>
        </div>

        <!-- Buttons -->
        <button id="guess-button" aria-label="Make a guess">Make a Guess</button>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBtw7Xj2rAG_zO1C2l9Ww4Jf2EUnZzPsdg&libraries=geometry&callback=initMap" async defer></script>
    <script src="script.js"></script>
</body>
</html>
